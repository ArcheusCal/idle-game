<main>
  <h1>Thing Clicker</h1>

  <!-- displays internalcount, defaults to zero -->
  <p>You have <span id="thingsdisplay">0</span> things</p>
  <!-- calls clickThing function when clicked -->
  <button class="main button" type="button" onClick="clickThing(1)" margin-bottom:400px>Increase thing</button> <br>
  <button class="buy button" type="button" onClick="buyProduction('farmer')" margin-bottom:100px>Buy thing farmer</button>
  
  <p>You have <span id="farmerdisplay">0</span> thing farmers, they cost <span id="farmercost">25</span> things to buy, and they produce <span id="farmerprodpersecond"> things per second.</p>
</main>
