<html lang="en">

  <link rel="stylesheet" type="text/css" href="interface.css" />

<body>

<main>
  <h1>Thing Clicker</h1>

  <!-- displays internalcount, defaults to zero -->
  <p>You have <span id="thingdisplay">0</span> things</p>
  <!-- calls clickThing function when clicked -->
  <button class="main button" type="button" onClick="clickThing(1)" margin-bottom:400px>Increase thing</button>
  <button class="buy button" type="button" onClick="buyProduction(1,1)" margin-bottom:100px>Buy thing farmer</button>
  <p>You have <span id="thingfarmers">0</span> thing farmers<br />
     They cost <span id="thingfarmerscost">25</span> things to buy
  </p>
</main>



</body>
